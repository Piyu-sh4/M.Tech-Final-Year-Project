<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Offline — Workforce Intelligence Platform</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:var(--wfi-font);
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 440px;
  }
  .icon { font-size: 64px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; }
  p  { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
  .badge {
    display: inline-block;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: #60a5fa;
    margin-bottom: 28px;
  }
  button {
    background: #1A3C6E;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2563eb; }
  .cached-hint { margin-top: 20px; font-size: 12px; color: #64748b; }

/* ── TOPBAR STYLES ─────────────────────────────── */
.navbar,.wiq-topbar,nav.topbar{
  display:flex!important;align-items:center!important;
  padding:0 20px!important;height:54px!important;
  background:#fff!important;
  border-bottom:2px solid #e8f0ff!important;
  position:sticky!important;top:0!important;z-index:100!important;
  gap:12px!important;flex-wrap:nowrap!important;
  box-shadow:0 1px 8px rgba(37,99,235,.08)!important;
}
.nav-brand{
  font-size:.88rem!important;font-weight:900!important;
  color:#1E3A5F!important;white-space:nowrap!important;
  display:flex!important;align-items:center!important;gap:6px!important;
  flex-shrink:0!important;letter-spacing:-.01em!important;
}
.nav-brand .logo-icon{
  width:28px!important;height:28px!important;
  background:linear-gradient(135deg,#2563EB,#7C3AED)!important;
  border-radius:7px!important;display:inline-flex!important;
  align-items:center!important;justify-content:center!important;
  font-size:.9rem!important;flex-shrink:0!important;
}
.nav-brand .logo-text{
  font-size:.85rem!important;font-weight:900!important;color:#1E3A5F!important;
}
.nav-brand .logo-version{
  font-size:.55rem!important;font-weight:700!important;
  color:#2563EB!important;background:#EFF6FF!important;
  padding:1px 5px!important;border-radius:4px!important;
  border:1px solid #BFDBFE!important;
}
.nav-info{
  display:flex!important;align-items:center!important;
  gap:8px!important;flex-shrink:0!important;margin-left:auto!important;
}
.nav-divider{width:1px!important;height:20px!important;background:#E2E8F0!important}

/* ── CARD COLOR SHADOWS ─────────────────────────────── */
.card,.wiq-card,[class*="-card"]{
  transition:all .25s cubic-bezier(.34,1.56,.64,1)!important;
  border-radius:12px!important;
}
.card:hover,.wiq-card:hover{
  transform:translateY(-4px) scale(1.006)!important;
  box-shadow:0 12px 32px rgba(37,99,235,.18),
             0 2px 8px rgba(37,99,235,.1)!important;
}
/* Module-specific card shadows */
.card-payroll:hover{box-shadow:0 12px 32px rgba(5,150,105,.18)!important}
.card-leave:hover{box-shadow:0 12px 32px rgba(245,158,11,.18)!important}
.card-alert:hover{box-shadow:0 12px 32px rgba(220,38,38,.18)!important}

/* ── BUTTON SYSTEM ─────────────────────────────────── */
.btn{
  display:inline-flex!important;align-items:center!important;
  gap:5px!important;padding:7px 16px!important;
  border-radius:8px!important;font-size:.76rem!important;
  font-weight:700!important;cursor:pointer!important;
  border:none!important;transition:all .2s!important;
  white-space:nowrap!important;font-family:var(--wfi-font);
}
.btn-primary{
  background:linear-gradient(135deg,#2563EB,#1D4ED8)!important;
  color:#fff!important;
  box-shadow:0 2px 8px rgba(37,99,235,.3)!important;
}
.btn-primary:hover{
  background:linear-gradient(135deg,#1D4ED8,#1E40AF)!important;
  box-shadow:0 4px 14px rgba(37,99,235,.4)!important;
  transform:translateY(-1px)!important;
}
.btn-outline,.btn-sm.btn-outline{
  background:#fff!important;color:#2563EB!important;
  border:1.5px solid #BFDBFE!important;
  padding:5px 13px!important;font-size:.72rem!important;
}
.btn-outline:hover{
  background:#EFF6FF!important;
  border-color:#2563EB!important;
  box-shadow:0 2px 8px rgba(37,99,235,.15)!important;
}
.btn-danger{
  background:linear-gradient(135deg,#DC2626,#B91C1C)!important;
  color:#fff!important;
}
.btn-danger:hover{box-shadow:0 4px 14px rgba(220,38,38,.35)!important}
.btn-success{
  background:linear-gradient(135deg,#059669,#047857)!important;
  color:#fff!important;
}
.btn-success:hover{box-shadow:0 4px 14px rgba(5,150,105,.35)!important}
.btn-sm{padding:5px 12px!important;font-size:.7rem!important}
.btn-lg{padding:10px 22px!important;font-size:.82rem!important}

/* ── STATUS BADGES ─────────────────────────────────── */
.badge,.status-badge,[class*=badge]{
  display:inline-flex!important;align-items:center!important;
  padding:3px 10px!important;border-radius:999px!important;
  font-size:.62rem!important;font-weight:800!important;
  text-transform:uppercase!important;letter-spacing:.04em!important;
}

/* ── SIDEBAR BRAND ─────────────────────────────────── */
.wiq-logo{
  display:flex!important;align-items:center!important;
  gap:8px!important;padding:0 4px!important;
}
.wiq-logo .logo-mark{
  width:32px!important;height:32px!important;
  background:linear-gradient(135deg,#2563EB,#7C3AED)!important;
  border-radius:9px!important;display:flex!important;
  align-items:center!important;justify-content:center!important;
  font-size:1rem!important;flex-shrink:0!important;
  box-shadow:0 4px 12px rgba(37,99,235,.35)!important;
}
.wiq-logo span{
  font-weight:900!important;font-size:.82rem!important;
  color:#F8FAFC!important;letter-spacing:-.01em!important;
}
</style>
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/navigation.css">
  <script src="/navigation.js" defer></script>

<script src="/appearance.js" defer></script>

<link rel="stylesheet" href="/preferences.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <div class="badge">Offline Mode</div>
  <h1>No Network Connection</h1>
  <p>
    You're currently offline. Workforce Intelligence Platform requires
    an active internet connection to load live data.
    Some cached pages may still be accessible.
  </p>
  <button onclick="window.location.reload()">🔄 Try Again</button>
  <p class="cached-hint">
    Cached pages: Dashboard · Tasks · Attendance · Profile
  </p>
</div>

<script id="wfi-utils">
(function(){
var w=window;
w.dlPrint=w.dlPrint||function(t,c){var wi=window.open('','_blank','width=1100,height=800');if(!wi)return;var h='<html><head><title>'+(t||'Report')+'<\/title><style>*{box-sizing:border-box}body{font-family:Segoe UI,sans-serif;padding:28px;color:#1e293b;max-width:960px;margin:0 auto}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2563EB;padding-bottom:12px;margin-bottom:20px}.brand{font-weight:900;color:#2563EB;font-size:1rem}.meta{font-size:.72rem;color:#64748b}h2{color:#1e293b;margin-bottom:14px}table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#1e3a5f;color:#fff;padding:8px 12px;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase}td{padding:8px 12px;border-bottom:1px solid #e2e8f0;font-size:.8rem}tr:nth-child(even)td{background:#f8fafc}.ftr{margin-top:20px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:.7rem;color:#94a3b8;display:flex;justify-content:space-between}.btn{background:#2563EB;color:#fff;border:none;padding:9px 24px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.8rem;margin-top:14px}@media print{.btn{display:none}}<\/style><\/head><body><div class="hdr"><div class="brand">&#9889; WFI<\/div><div class="meta">'+new Date().toLocaleString()+'<\/div><\/div><h2>'+(t||'Report')+'<\/h2>'+(c||'<p>No data.<\/p>')+'<div class="ftr"><span>WFI<\/span><span>'+new Date().toLocaleDateString()+'<\/span><\/div><button class="btn" onclick="window.print()">Print \/ PDF<\/button><\/body><\/html>';wi.document.write(h);wi.document.close();};
w.dlCSV=w.dlCSV||function(rows,h,fn){if(!rows||!rows.length)rows=[{}];var keys=h||Object.keys(rows[0]);var L=[keys.map(function(k){return'"'+k+'"';}).join(',')];rows.forEach(function(r){L.push(keys.map(function(k){return'"'+String(r[k]!==undefined?r[k]:'').replace(/"/g,'""')+'"';}).join(','));});var blob=new Blob([L.join('\n')],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=(fn||'export')+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);};
w.tdm=w.tdm||function(){var d=document.body.classList.toggle('dark-mode');localStorage.setItem('wfi_dark_mode',d?'1':'0');var b=document.getElementById('dmt')||document.getElementById('dmToggle');var i=document.getElementById('dmi')||document.getElementById('dmIcon');if(b)b.classList.toggle('on',d);if(i)i.textContent=d?'&#9728;':'&#127769;';};
w.toggleDarkMode=w.tdm;
w.showTab=w.showTab||function(id,btn){var lo=id.toLowerCase();var el=document.getElementById('tab'+id)||document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1))||document.getElementById('tab-'+id)||document.getElementById(id)||document.getElementById('section-'+id);if(!el){var all=document.querySelectorAll('[id]');for(var i=0;i<all.length;i++){if(all[i].id.toLowerCase()==='tab'+lo||all[i].id.toLowerCase()===lo||all[i].id.toLowerCase()==='section-'+lo){el=all[i];break;}}}document.querySelectorAll('[id]').forEach(function(s){var sid=s.id.toLowerCase();if((sid.startsWith('tab')||sid.startsWith('section-')||sid.startsWith('panel-'))&&sid!==lo&&sid!=='tab'+lo&&sid!=='section-'+lo)s.style.display='none';});if(el){el.style.display='';el.classList.add('on');}document.querySelectorAll('.sc').forEach(function(e){e.classList.remove('on');});var sc=document.getElementById('tab'+id)||document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1));if(sc)sc.classList.add('on');document.querySelectorAll('.tb,.tab-btn,[role=tab]').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');};
w.switchTab=w.switchTab||w.showTab;
w.showSection=w.showSection||function(id,btn){document.querySelectorAll('[id^="section-"]').forEach(function(e){e.style.display='none';});var el=document.getElementById('section-'+id)||document.getElementById(id);if(el)el.style.display='block';document.querySelectorAll('.tb,.section-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');};
w.sw=w.sw||w.showSection;
w.st=w.st||function(msg,ok){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.background=ok!==false?'linear-gradient(135deg,#059669,#047857)':'linear-gradient(135deg,#DC2626,#B91C1C)';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);};
w.showToast=w.st;
w.logout=w.logout||function(){localStorage.clear();window.location.href='login.html';};
w.ac=w.ac||function(){var b=document.getElementById('cookieBanner')||document.getElementById('ckb');if(b){b.style.display='none';try{localStorage.setItem('wfi_ck','1');}catch(e){}}};
w.dc=w.dc||function(){var b=document.getElementById('cookieBanner')||document.getElementById('ckb');if(b)b.style.display='none';};
w.acceptCookies=w.ac;w.declineCookies=w.dc;

















w.closeModal=w.closeModal||function(){document.querySelectorAll('.modal,.dialog').forEach(function(m){m.style.display='none';});};






















w.closeRejectModal=w.closeRejectModal||function(){document.querySelectorAll('.modal').forEach(function(m){m.style.display='none';});};


w.openMobSidebar=w.openMobSidebar||function(){var s=document.querySelector('.wiq-sidebar');if(s)s.classList.toggle('open');};
w.toggleSidebar=w.toggleSidebar||function(){var s=document.querySelector('.wiq-sidebar');if(s)s.classList.toggle('collapsed');};
w.toggleGroup=w.toggleGroup||function(id){var el=document.getElementById(id);if(el)el.style.display=el.style.display==='none'?'block':'none';};



})();
</script>
</body>
</html>
