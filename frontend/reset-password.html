<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · Workforce Intelligence</title>
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/navigation.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/navigation.js" defer></script>
  <script src="/password-recovery.js" defer></script>
</head>
<body class="wfi-login">
  <main class="auth-shell">
    <section class="auth-intro" aria-labelledby="workspace-intro">
      <div>
        <p class="auth-kicker">Workforce workspace</p>
        <h2 id="workspace-intro">Workforce Intelligence</h2>
        <p>Recover access to your account.</p>
      </div>
    </section>
    <div class="auth-side">
      <section class="sign-in-card" aria-labelledby="recovery-title">
        <h1 id="recovery-title">Reset your password</h1>
        <p id="recovery-instructions">Enter your work email to request a reset link.</p>
        <form id="recovery-request">
          <div class="form-group">
            <label for="recovery-email">Work email</label>
            <input type="email" id="recovery-email" name="email" autocomplete="email" maxlength="120" required>
          </div>
          <button type="submit" class="btn-login">Send reset link</button>
        </form>
        <form id="recovery-confirm" hidden>
          <div class="form-group">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" name="password" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" name="confirmation" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn-login">Update password</button>
        </form>
        <p id="recovery-status" role="status"></p>
        <p class="auth-link"><a href="/login.html">Back to sign in</a></p>
      </section>
    </div>
  </main>
</body>
</html>
