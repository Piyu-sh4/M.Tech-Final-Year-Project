<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driver Management — WorkforceIQ</title>
<link rel="stylesheet" href="styles.css">
<style>
  .page-wrap{max-width:1200px;margin:0 auto;padding:80px 20px 40px}
  .page-title{font-size:1.5rem;font-weight:800;color:#1e293b;margin-bottom:4px}
  .page-sub{font-size:.85rem;color:#64748b;margin-bottom:24px}
  /* tabs */
  .tab-nav{display:flex;gap:6px;background:#f1f5f9;padding:8px;border-radius:14px;margin-bottom:24px;flex-wrap:wrap}
  .tab-btn{padding:8px 18px;border:none;border-radius:10px;cursor:pointer;font-size:.85rem;font-weight:600;background:transparent;color:#64748b;transition:all .2s}
  .tab-btn.active{background:#fff;color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.15)}
  .tab-panel{display:none}.tab-panel.active{display:block}
  /* driver grid */
  .driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .driver-card-ui{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;overflow:hidden;transition:all .2s;cursor:pointer}
  .driver-card-ui:hover{border-color:#2563eb;box-shadow:0 8px 24px rgba(37,99,235,.12);transform:translateY(-2px)}
  .dcard-top{background:linear-gradient(135deg,#1e3a8a,#1d4ed8);padding:20px;display:flex;gap:14px;align-items:center}
  .dcard-avatar{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
  .dcard-name{font-size:1rem;font-weight:800;color:#fff}
  .dcard-code{font-size:.72rem;color:#93c5fd;margin-top:2px}
  .dcard-status{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;padding:2px 8px;border-radius:999px;margin-top:4px;font-weight:700}
  .ds-active{background:rgba(34,197,94,.2);color:#86efac}
  .ds-on_leave{background:rgba(234,179,8,.2);color:#fde047}
  .ds-suspended{background:rgba(239,68,68,.2);color:#fca5a5}
  .ds-inactive{background:rgba(100,116,139,.2);color:#94a3b8}
  .dcard-body{padding:16px}
  .dcard-row{display:flex;align-items:center;gap:8px;font-size:.8rem;color:#475569;margin-bottom:6px}
  .dcard-row a{color:#2563eb;text-decoration:none}
  .rating-bar{display:flex;align-items:center;gap:4px;margin-top:8px}
  .star-f{color:#fbbf24;font-size:.85rem}
  .star-e{color:#e2e8f0;font-size:.85rem}
  .dcard-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .dpill{font-size:.68rem;padding:3px 8px;border-radius:6px;font-weight:600;background:#f1f5f9;color:#475569}
  /* Form */
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-group label{display:block;font-weight:600;font-size:.82rem;color:#374151;margin-bottom:4px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.85rem;box-sizing:border-box;transition:border-color .2s}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2563eb}
  .section-divider{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#64748b;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
  /* Detail modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{background:#fff;border-radius:20px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,.3)}
  .modal-header{background:linear-gradient(135deg,#1e3a8a,#0891b2);padding:24px 28px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center}
  .modal-title{font-size:1.1rem;font-weight:800;color:#fff}
  .modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;transition:background .2s}
  .modal-close:hover{background:rgba(255,255,255,.25)}
  .modal-body{padding:24px 28px}
  .detail-section{margin-bottom:20px}
  .detail-section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:10px}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .detail-field{background:#f8fafc;border-radius:8px;padding:10px 12px}
  .detail-field-label{font-size:.68rem;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .detail-field-val{font-size:.85rem;font-weight:600;color:#1e293b}
  .id-card-placeholder{background:linear-gradient(135deg,#1e3a8a,#0891b2);border-radius:12px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .id-card-name{font-size:1rem;font-weight:800}
  .id-card-num{font-size:.8rem;color:#bfdbfe;letter-spacing:.1em}
  .id-card-row{display:flex;justify-content:space-between;font-size:.72rem;color:#93c5fd}
  .expiry-warning{background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:8px 12px;font-size:.78rem;color:#854d0e;margin-top:8px}
  @media(max-width:600px){.form-2col,.detail-grid{grid-template-columns:1fr}.driver-grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">⚡ Workforce<b>IQ</b></div>
  <div class="nav-links">
    <a href="admin-dashboard.html" style="color:#fff">← Dashboard</a>
    <button onclick="logout()" class="btn btn-sm btn-outline" style="margin-left:8px">Logout</button>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-title">🧑‍✈️ Driver Management</div>
  <div class="page-sub">Company cab drivers — profiles, assignments, ID cards and performance</div>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab(this,'all_drivers')">👥 All Drivers</button>
    <button class="tab-btn" onclick="switchTab(this,'add_driver')">➕ Add Driver</button>
    <button class="tab-btn" onclick="switchTab(this,'sos_alerts')">🚨 SOS Alerts</button>
  </div>

  <!-- ALL DRIVERS -->
  <div id="tab-all_drivers" class="tab-panel active">
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <input id="driverSearch" oninput="filterDrivers()" placeholder="Search name, code, mobile…"
        style="padding:9px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:.85rem;flex:1;min-width:200px">
      <select id="driverStatusFilter" onchange="filterDrivers()"
        style="padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:.85rem">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="on_leave">On Leave</option>
        <option value="suspended">Suspended</option>
        <option value="inactive">Inactive</option>
      </select>
      <button onclick="loadDrivers()" class="btn btn-sm">🔄 Refresh</button>
    </div>
    <div id="driverStatsRow" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px"></div>
    <div class="driver-grid" id="driverGrid"><p style="color:#94a3b8">Loading drivers…</p></div>
  </div>

  <!-- ADD DRIVER -->
  <div id="tab-add_driver" class="tab-panel">
    <div class="card" style="max-width:760px">
      <h3 style="margin-top:0;margin-bottom:20px;color:#1e293b">➕ Register New Driver</h3>
      <p id="addDriverMsg" class="msg"></p>

      <div class="section-divider">Personal Information</div>
      <div class="form-2col">
        <div class="form-group"><label>Full Name *</label><input id="dFullName" placeholder="e.g. Ramesh Kumar Singh"></div>
        <div class="form-group"><label>Mobile Number *</label><input id="dMobile" placeholder="+91-98XXXXXXXX"></div>
        <div class="form-group"><label>Alternate Mobile</label><input id="dAltMobile" placeholder="Optional"></div>
        <div class="form-group"><label>Email</label><input id="dEmail" type="email" placeholder="driver@company.com"></div>
      </div>
      <div class="form-group"><label>Address *</label><textarea id="dAddress" rows="2" placeholder="Full residential address including city, pin code"></textarea></div>
      <div class="form-2col">
        <div class="form-group"><label>Emergency Contact Name</label><input id="dEmgName" placeholder="Spouse/Parent name"></div>
        <div class="form-group"><label>Emergency Contact Mobile</label><input id="dEmgMobile" placeholder="+91-98XXXXXXXX"></div>
      </div>

      <div class="section-divider">License & ID Documents</div>
      <div class="form-2col">
        <div class="form-group"><label>Driving License Number *</label><input id="dLicense" placeholder="e.g. BR-2021-0123456"></div>
        <div class="form-group"><label>License Expiry Date *</label><input id="dLicenseExpiry" type="date"></div>
        <div class="form-group"><label>ID Card Type *</label>
          <select id="dIdType">
            <option value="Aadhaar">Aadhaar Card</option>
            <option value="Driving License">Driving License</option>
            <option value="Passport">Passport</option>
            <option value="Company ID">Company ID</option>
          </select>
        </div>
        <div class="form-group"><label>ID Card Number *</label><input id="dIdNumber" placeholder="XXXX XXXX XXXX"></div>
        <div class="form-group"><label>Joining Date</label><input id="dJoining" type="date"></div>
      </div>

      <div class="section-divider">Route & Vehicle Assignment</div>
      <div class="form-2col">
        <div class="form-group"><label>Assigned Route</label>
          <select id="dRoute"><option value="">– No route –</option></select>
        </div>
        <div class="form-group"><label>Assigned Vehicle</label>
          <select id="dVehicle"><option value="">– No vehicle –</option></select>
        </div>
      </div>
      <div class="form-group"><label>Notes</label><textarea id="dNotes" rows="2" placeholder="Medical conditions, languages spoken, special notes…"></textarea></div>

      <button onclick="submitAddDriver()" class="btn btn-full" style="background:linear-gradient(135deg,#1a56db,#0891b2);margin-top:8px;font-size:.95rem">
        🧑‍✈️ Register Driver
      </button>
    </div>
  </div>

  <!-- SOS ALERTS -->
  <div id="tab-sos_alerts" class="tab-panel">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin:0;color:#dc2626">🚨 Active SOS Alerts</h3>
        <button onclick="loadSOS()" class="btn btn-sm">Refresh</button>
      </div>
      <div id="sosList"><p style="color:#94a3b8">Loading…</p></div>
    </div>
  </div>
</div>

<!-- DRIVER DETAIL MODAL -->
<div class="modal-overlay" id="driverModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Driver Profile</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">Loading…</div>
  </div>
</div>

<script src="app.js"></script>
<script>
var _allDrivers = [];

function switchTab(btn, name) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='all_drivers') loadDrivers();
  if(name==='sos_alerts')  loadSOS();
}

/* ── Load drivers ─────────────────────── */
async function loadDrivers() {
  try {
    var r = await fetch(API+'/cab/drivers', { headers: authHeaders() });
    _allDrivers = await r.json();
    renderStats(_allDrivers);
    renderGrid(_allDrivers);
  } catch(e){ document.getElementById('driverGrid').innerHTML='<p style="color:#94a3b8">Could not load drivers.</p>'; }
}

function renderStats(drivers) {
  var active  = drivers.filter(function(d){ return d.status==='active'; }).length;
  var onLeave = drivers.filter(function(d){ return d.status==='on_leave'; }).length;
  var expSoon = drivers.filter(function(d){
    if(!d.license_expiry) return false;
    var exp = new Date(d.license_expiry);
    var diff = (exp - new Date()) / (1000*86400);
    return diff < 30 && diff > 0;
  }).length;
  document.getElementById('driverStatsRow').innerHTML =
    statCard('Active Drivers', active, '#16a34a', '#dcfce7')+
    statCard('On Leave', onLeave, '#d97706', '#fef9c3')+
    statCard('License Expiring <30d', expSoon, '#dc2626', '#fee2e2')+
    statCard('Total Drivers', drivers.length, '#2563eb', '#dbeafe');
}

function statCard(label, val, color, bg) {
  return '<div style="background:'+bg+';border-radius:10px;padding:10px 16px;text-align:center;min-width:100px">'+
    '<div style="font-size:1.5rem;font-weight:900;color:'+color+'">'+val+'</div>'+
    '<div style="font-size:.7rem;color:#64748b;margin-top:2px">'+label+'</div></div>';
}

function renderGrid(drivers) {
  var grid = document.getElementById('driverGrid');
  if(!drivers.length){ grid.innerHTML='<p style="color:#94a3b8">No drivers found.</p>'; return; }
  grid.innerHTML = drivers.map(function(d){ return driverCardHTML(d); }).join('');
}

function driverCardHTML(d) {
  var stClass = 'ds-'+(d.status||'inactive');
  var stLabel = (d.status||'inactive').replace('_',' ');
  var rating  = parseFloat(d.avg_rating||d.rating||5);
  var stars   = '';
  for(var i=1;i<=5;i++) stars += '<span class="'+(i<=Math.round(rating)?'star-f':'star-e')+'">★</span>';
  var expDate  = d.license_expiry ? new Date(d.license_expiry) : null;
  var daysLeft = expDate ? Math.ceil((expDate - new Date()) / 86400000) : 999;
  return '<div class="driver-card-ui" onclick="openDriverModal('+d.driver_id+')">'+
    '<div class="dcard-top">'+
      '<div class="dcard-avatar">🧑‍✈️</div>'+
      '<div>'+
        '<div class="dcard-name">'+escHtml(d.full_name)+'</div>'+
        '<div class="dcard-code">'+escHtml(d.employee_code)+'</div>'+
        '<span class="dcard-status '+stClass+'">● '+stLabel+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="dcard-body">'+
      '<div class="dcard-row">📞 <a href="tel:'+escHtml(d.mobile)+'">'+escHtml(d.mobile)+'</a></div>'+
      (d.route_name?'<div class="dcard-row">📍 '+escHtml(d.route_name)+'</div>':'')+
      (d.vehicle_label?'<div class="dcard-row">'+(d.vehicle_type==='Bus'?'🚌':d.vehicle_type==='Car'?'🚗':'🏍️')+' '+escHtml(d.vehicle_label)+'</div>':'')+
      '<div class="rating-bar">'+stars+'<span style="font-size:.75rem;color:#64748b;margin-left:4px">'+rating.toFixed(1)+' ('+d.total_trips+' trips)</span></div>'+
      (daysLeft < 30 && daysLeft > 0 ? '<div style="background:#fef9c3;border-radius:6px;padding:4px 8px;font-size:.72rem;color:#854d0e;margin-top:8px">⚠️ License expiring in '+daysLeft+'d</div>':'')+ 
      '<div class="dcard-pills">'+
        '<span class="dpill">'+escHtml(d.id_card_type||'Aadhaar')+'</span>'+
        (d.joining_date?'<span class="dpill">Since '+new Date(d.joining_date).getFullYear()+'</span>':'')+
      '</div>'+
    '</div>'+
  '</div>';
}

function filterDrivers() {
  var search = (document.getElementById('driverSearch').value||'').toLowerCase();
  var status = document.getElementById('driverStatusFilter').value;
  var filtered = _allDrivers.filter(function(d){
    var matchSearch = !search || d.full_name.toLowerCase().includes(search) ||
      d.employee_code.toLowerCase().includes(search) || d.mobile.includes(search);
    var matchStatus = !status || d.status===status;
    return matchSearch && matchStatus;
  });
  renderGrid(filtered);
}

/* ── Driver modal ─────────────────────── */
async function openDriverModal(id) {
  document.getElementById('driverModal').classList.add('open');
  document.getElementById('modalBody').innerHTML='<div style="text-align:center;padding:40px;color:#64748b">Loading…</div>';
  try {
    var r = await fetch(API+'/cab/drivers/'+id, { headers: authHeaders() });
    var d = await r.json();
    document.getElementById('modalTitle').textContent = d.full_name + ' ('+d.employee_code+')';
    var expDate  = d.license_expiry ? new Date(d.license_expiry) : null;
    var daysLeft = expDate ? Math.ceil((expDate - new Date()) / 86400000) : 999;
    var stClass  = 'ds-'+(d.status||'inactive');
    var rating   = parseFloat(d.avg_rating||d.rating||5);
    var stars=''; for(var i=1;i<=5;i++) stars+='<span style="color:'+(i<=Math.round(rating)?'#fbbf24':'#e2e8f0');stars+='">★</span>';

    var recentTrips = (d.recent_trips||[]).slice(0,5).map(function(t){
      return '<div style="display:flex;justify-content:space-between;font-size:.78rem;padding:6px 0;border-bottom:1px solid #f1f5f9">'+
        '<span>'+formatDate(t.booking_date)+'</span>'+
        '<span>'+escHtml(t.route_name)+'</span>'+
        '<span style="color:'+(t.journey_status==='completed'?'#16a34a':'#64748b')+'">'+t.journey_status+'</span></div>';
    }).join('') || '<div style="color:#94a3b8;font-size:.8rem">No trips yet.</div>';

    var recentRatings = (d.recent_ratings||[]).slice(0,5).map(function(r){
      var s=''; for(var i=1;i<=5;i++) s+='<span style="color:'+(i<=r.rating?'#fbbf24':'#e2e8f0')+'">★</span>';
      return '<div style="padding:6px 0;border-bottom:1px solid #f1f5f9">'+
        '<div style="display:flex;justify-content:space-between;font-size:.78rem">'+
          '<span>'+escHtml(r.reviewer)+'</span><span>'+s+'</span>'+
        '</div>'+
        (r.feedback?'<div style="font-size:.75rem;color:#64748b;margin-top:2px">'+escHtml(r.feedback)+'</div>':'')+
      '</div>';
    }).join('') || '<div style="color:#94a3b8;font-size:.8rem">No ratings yet.</div>';

    document.getElementById('modalBody').innerHTML =
      // Avatar + status
      '<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:linear-gradient(135deg,#f0f4ff,#f5f3ff);border-radius:12px">'+
        '<div style="width:64px;height:64px;background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem">🧑‍✈️</div>'+
        '<div>'+
          '<div style="font-size:1.1rem;font-weight:800;color:#1e293b">'+escHtml(d.full_name)+'</div>'+
          '<div style="font-size:.78rem;color:#64748b">'+escHtml(d.employee_code)+'</div>'+
          '<span class="dcard-status '+stClass+'" style="margin-top:4px;display:inline-flex">● '+(d.status||'').replace('_',' ')+'</span>'+
        '</div>'+
        '<div style="margin-left:auto;text-align:center">'+
          '<div style="font-size:.72rem;color:#64748b">Rating</div>'+
          '<div>'+stars+'</div>'+
          '<div style="font-size:.78rem;font-weight:700;color:#f59e0b">'+rating.toFixed(1)+'/5</div>'+
        '</div>'+
      '</div>'+

      // Contact
      '<div class="detail-section">'+
        '<div class="detail-section-title">📞 Contact</div>'+
        '<div class="detail-grid">'+
          dfield('Mobile', d.mobile)+ dfield('Alt Mobile', d.alt_mobile||'–')+
          dfield('Email', d.email||'–')+ dfield('Address', d.address)+
          dfield('Emergency Contact', d.emergency_contact_name||'–')+
          dfield('Emergency Mobile', d.emergency_contact_mobile||'–')+
        '</div>'+
      '</div>'+

      // License
      '<div class="detail-section">'+
        '<div class="detail-section-title">📄 License & Documents</div>'+
        '<div class="detail-grid">'+
          dfield('License Number', d.license_number)+
          dfield('License Expiry', d.license_expiry ? new Date(d.license_expiry).toLocaleDateString() : '–')+
        '</div>'+
        (daysLeft < 30 && daysLeft > 0 ?
          '<div class="expiry-warning">⚠️ License expires in '+daysLeft+' days! Please arrange renewal.</div>' : '')+
        // Real ID Card
        '<div id="driverCardWrap_'+d.driver_id+'" style="margin-top:14px">'+
          '<div style="background:linear-gradient(135deg,#0c1a3a 0%,#1a3a8a 55%,#0891b2 100%);border-radius:16px;padding:20px 22px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(8,145,178,.3)" id="driverCard_'+d.driver_id+'">'+
            '<div style="position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05)"></div>'+
            '<div style="font-size:.8rem;font-weight:900;letter-spacing:.06em;margin-bottom:12px;opacity:.9">⚡ WorkforceIQ · Cab Driver</div>'+
            '<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:12px">'+
              '<div style="width:58px;height:58px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;overflow:hidden">'+
                (d.photo_url ? '<img src="'+escHtml(d.photo_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">' : '🧑‍✈️')+
              '</div>'+
              '<div style="flex:1;min-width:0">'+
                '<div style="font-size:1rem;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(d.full_name)+'</div>'+
                '<div style="font-size:.7rem;color:#7dd3fc;margin-bottom:8px">Cab Driver</div>'+
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+
                  '<div style="background:rgba(255,255,255,.08);border-radius:6px;padding:5px 8px"><div style="font-size:.55rem;color:#93c5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px">Emp. Code</div><div style="font-size:.75rem;font-weight:700">'+escHtml(d.employee_code)+'</div></div>'+
                  '<div style="background:rgba(255,255,255,.08);border-radius:6px;padding:5px 8px"><div style="font-size:.55rem;color:#93c5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px">Route</div><div style="font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(d.route_name||'N/A')+'</div></div>'+
                  '<div style="background:rgba(255,255,255,.08);border-radius:6px;padding:5px 8px"><div style="font-size:.55rem;color:#93c5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px">Vehicle</div><div style="font-size:.75rem;font-weight:700">'+escHtml(d.vehicle_label||'N/A')+'</div></div>'+
                  '<div style="background:rgba(255,255,255,.08);border-radius:6px;padding:5px 8px"><div style="font-size:.55rem;color:#93c5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px">License</div><div style="font-size:.68rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(d.license_number||'N/A')+'</div></div>'+
                '</div>'+
              '</div>'+
            '</div>'+
            '<div style="background:rgba(255,255,255,.92);border-radius:7px;padding:7px 10px 3px;text-align:center">'+
              '<canvas id="drvBC_'+d.driver_id+'" height="42" style="width:100%;display:block"></canvas>'+
              '<div style="font-size:.58rem;color:#0f172a;font-family:monospace;letter-spacing:.14em;font-weight:700;margin-top:2px">'+escHtml(d.employee_code)+'</div>'+
            '</div>'+
            '<div style="display:flex;justify-content:space-between;font-size:.58rem;color:rgba(255,255,255,.4);margin-top:8px">'+
              '<span>WorkforceIQ v7.0</span><span>Valid: '+new Date().getFullYear()+'</span>'+
            '</div>'+
          '</div>'+
          '<button onclick="printCabDriverCard(\'driverCard_'+d.driver_id+'\')" style="width:100%;margin-top:8px;background:rgba(8,145,178,.1);border:1.5px solid rgba(8,145,178,.35);border-radius:8px;color:#0891b2;padding:9px;font-size:.82rem;font-weight:700;cursor:pointer">🖨️ Print ID Card</button>'+
        '</div>'+
      '</div>'+

      // Assignment
      '<div class="detail-section">'+
        '<div class="detail-section-title">🚌 Assignment</div>'+
        '<div class="detail-grid">'+
          dfield('Route', d.route_name||'Not assigned')+
          dfield('Vehicle', d.vehicle_label||'Not assigned')+
          dfield('Total Trips', d.total_trips||0)+
          dfield('Joined', d.joining_date ? new Date(d.joining_date).toLocaleDateString() : '–')+
        '</div>'+
      '</div>'+

      // Recent trips
      '<div class="detail-section">'+
        '<div class="detail-section-title">🗺️ Recent Trips</div>'+
        recentTrips+
      '</div>'+

      // Recent ratings
      '<div class="detail-section">'+
        '<div class="detail-section-title">⭐ Recent Ratings</div>'+
        recentRatings+
      '</div>'+

      // Actions
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
        '<button onclick="editDriverStatus('+d.driver_id+',\'on_leave\')" class="btn btn-sm" style="background:#fef9c3;color:#854d0e">Set On Leave</button>'+
        '<button onclick="editDriverStatus('+d.driver_id+',\'active\')"   class="btn btn-sm" style="background:#dcfce7;color:#15803d">Set Active</button>'+
        '<button onclick="editDriverStatus('+d.driver_id+',\'suspended\')" class="btn btn-sm" style="background:#fee2e2;color:#991b1b">Suspend</button>'+
      '</div>';
    // Render barcode after DOM update
    setTimeout(function(){
      var barcodeVal = (d.employee_code||('DRV'+String(d.driver_id).padStart(4,'0'))).replace(/[^A-Z0-9\-]/gi,'').toUpperCase();
      try {
        JsBarcode('#drvBC_'+d.driver_id, barcodeVal, {format:'CODE128',width:2,height:42,displayValue:false,margin:4,background:'transparent',lineColor:'#0f172a'});
      } catch(e) {
        var c=document.getElementById('drvBC_'+d.driver_id);
        if(!c) return;
        var ctx=c.getContext('2d'); c.width=c.offsetWidth||300; c.height=42;
        ctx.fillStyle='#0f172a'; var x=8;
        for(var i=0;i<barcodeVal.length;i++){var bits=(barcodeVal.charCodeAt(i)).toString(2).padStart(8,'0');for(var b=0;b<8;b++){if(bits[b]==='1')ctx.fillRect(x,4,2,34);x+=3;}x+=2;}
      }
    }, 80);
  } catch(e){ document.getElementById('modalBody').innerHTML='<p style="color:#dc2626">Failed to load driver details.</p>'; }
}

function printCabDriverCard(cardId) {
  var el = document.getElementById(cardId);
  if (!el) return;
  var w = window.open('', '_blank', 'width=500,height=420');
  w.document.write('<!DOCTYPE html><html><head><title>Driver ID Card</title>');
  w.document.write('<style>body{margin:0;background:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Segoe UI,Arial,sans-serif}@media print{body{background:#fff}}</style>');
  w.document.write('</head><body><div style="padding:20px">'+el.outerHTML+'</div></body></html>');
  w.document.close();
  w.onload = function(){ w.focus(); w.print(); };
}

function dfield(label, val) {
  return '<div class="detail-field"><div class="detail-field-label">'+escHtml(label)+'</div><div class="detail-field-val">'+escHtml(String(val||'–'))+'</div></div>';
}

async function editDriverStatus(id, status) {
  try {
    var r = await fetch(API+'/cab/drivers/'+id, {method:'PATCH',headers:authHeaders(),body:JSON.stringify({status})});
    var d = await r.json(); alert(d.message);
    closeModal(); loadDrivers();
  } catch(e){ alert('Failed.'); }
}

function closeModal(){ document.getElementById('driverModal').classList.remove('open'); }

/* ── Add driver ───────────────────────── */
async function loadRouteVehicleOptions() {
  try {
    var routes   = await (await fetch(API+'/cab/routes',  {headers:authHeaders()})).json();
    var vehicles = await (await fetch(API+'/cab/vehicles',{headers:authHeaders()})).json();
    var rSel = document.getElementById('dRoute');
    var vSel = document.getElementById('dVehicle');
    routes.forEach(function(r){ var o=document.createElement('option'); o.value=r.route_id; o.textContent=r.route_name; rSel.appendChild(o); });
    vehicles.forEach(function(v){ var o=document.createElement('option'); o.value=v.vehicle_id; o.textContent=v.label; vSel.appendChild(o); });
  } catch(e){}
}

async function submitAddDriver() {
  var body = {
    full_name:    document.getElementById('dFullName').value.trim(),
    mobile:       document.getElementById('dMobile').value.trim(),
    alt_mobile:   document.getElementById('dAltMobile').value.trim(),
    email:        document.getElementById('dEmail').value.trim(),
    address:      document.getElementById('dAddress').value.trim(),
    license_number: document.getElementById('dLicense').value.trim(),
    license_expiry: document.getElementById('dLicenseExpiry').value,
    id_card_type:   document.getElementById('dIdType').value,
    id_card_number: document.getElementById('dIdNumber').value.trim(),
    vehicle_id:     document.getElementById('dVehicle').value||null,
    assigned_route: document.getElementById('dRoute').value||null,
    joining_date:   document.getElementById('dJoining').value||null,
    emergency_contact_name:   document.getElementById('dEmgName').value.trim(),
    emergency_contact_mobile: document.getElementById('dEmgMobile').value.trim(),
    notes: document.getElementById('dNotes').value.trim()
  };
  if(!body.full_name||!body.mobile||!body.address||!body.license_number||!body.license_expiry||!body.id_card_number)
    return showMsg('addDriverMsg','Please fill all required fields.',true);
  try {
    var r = await fetch(API+'/cab/drivers',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
    var d = await r.json();
    showMsg('addDriverMsg', d.message, !r.ok);
    if(r.ok){ loadDrivers(); setTimeout(function(){ document.querySelector('.tab-btn').click(); },1500); }
  } catch(e){ showMsg('addDriverMsg','Failed.',true); }
}

/* ── SOS list ─────────────────────────── */
async function loadSOS() {
  var c = document.getElementById('sosList');
  try {
    var r = await fetch(API+'/cab/sos',{headers:authHeaders()});
    var list = await r.json();
    if(!list.length){ c.innerHTML='<p style="color:#16a34a;font-weight:600">✅ No active SOS alerts.</p>'; return; }
    c.innerHTML = list.map(function(s){
      return '<div style="background:#fff5f5;border:2px solid #fca5a5;border-radius:12px;padding:16px;margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">'+
          '<div>'+
            '<div style="font-size:1rem;font-weight:800;color:#991b1b">🚨 '+escHtml(s.full_name)+'</div>'+
            '<div style="font-size:.8rem;color:#64748b;margin-top:4px">'+
              '📅 '+formatDate(s.booking_date)+' &nbsp;·&nbsp; 📍 '+escHtml(s.route_name)+
              (s.driver_name?' &nbsp;·&nbsp; 🧑‍✈️ '+escHtml(s.driver_name)+' ('+escHtml(s.driver_mobile||'')+')')+''+
            '</div>'+
            (s.message?'<div style="font-size:.8rem;color:#991b1b;margin-top:6px;background:#fee2e2;padding:6px 10px;border-radius:6px">'+escHtml(s.message)+'</div>':'')+
            (s.latitude?'<div style="font-size:.75rem;color:#64748b;margin-top:4px">📡 GPS: '+s.latitude+', '+s.longitude+'</div>':'')+
          '</div>'+
          '<button onclick="resolveSOS('+s.sos_id+')" class="btn btn-sm" style="background:#dcfce7;color:#15803d">✅ Resolve</button>'+
        '</div>'+
      '</div>';
    }).join('');
  } catch(e){ c.innerHTML='<p style="color:#94a3b8">Could not load SOS alerts.</p>'; }
}

async function resolveSOS(id) {
  try{
    var r=await fetch(API+'/cab/sos/'+id+'/resolve',{method:'PATCH',headers:authHeaders()});
    var d=await r.json(); alert(d.message); loadSOS();
  }catch(e){alert('Failed.');}
}

/* ── Boot ─────────────────────────────── */
document.addEventListener('DOMContentLoaded', function(){
  var u=getUser(); if(!u){window.location.href='login.html';return;}
  loadDrivers();
  loadRouteVehicleOptions();
});
</script>
