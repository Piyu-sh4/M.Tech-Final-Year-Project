<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Offline — Workforce Intelligence Platform</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 440px;
  }
  .icon { font-size: 64px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; }
  p  { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
  .badge {
    display: inline-block;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: #60a5fa;
    margin-bottom: 28px;
  }
  button {
    background: #1A3C6E;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2563eb; }
  .cached-hint { margin-top: 20px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <div class="badge">Offline Mode</div>
  <h1>No Network Connection</h1>
  <p>
    You're currently offline. Workforce Intelligence Platform requires
    an active internet connection to load live data.
    Some cached pages may still be accessible.
  </p>
  <button onclick="window.location.reload()">🔄 Try Again</button>
  <p class="cached-hint">
    Cached pages: Dashboard · Tasks · Attendance · Profile
  </p>
</div>
</body>
</html>
