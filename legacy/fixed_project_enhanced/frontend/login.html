<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Workforce Intelligence v6.0</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#0f172a 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .auth-wrap{width:100%;max-width:400px}
    .brand{text-align:center;margin-bottom:28px}
    .brand-icon{font-size:52px;display:block;animation:float 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .brand h1{color:#f8fafc;font-size:1.6rem;font-weight:900;margin:10px 0 4px;letter-spacing:-.5px}
    .brand p{color:#64748b;font-size:13px}
    .auth-card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px}
    .demo-box{background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);border-radius:10px;padding:11px 16px;margin-bottom:20px;text-align:center;font-size:12px;color:#93c5fd}
    .demo-box b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#60a5fa;margin-bottom:3px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
    .form-group input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#f1f5f9;font-size:14px;box-sizing:border-box;outline:none;transition:border-color .2s;font-family:inherit}
    .form-group input:focus{border-color:#3b82f6;background:rgba(255,255,255,.12)}
    .form-group input::placeholder{color:#475569}
    .btn-login{width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px;font-family:inherit;transition:opacity .2s;letter-spacing:.2px}
    .btn-login:hover{opacity:.92}
    .btn-login:disabled{opacity:.5;cursor:not-allowed}
    .msg-box{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:13px;font-weight:600;display:none;text-align:center}
    .msg-box.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;display:block}
    .msg-box.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac;display:block}
    .auth-link{text-align:center;margin-top:20px;color:#64748b;font-size:13px}
    .auth-link a{color:#60a5fa;font-weight:700;text-decoration:none}
    .badges{display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap}
    .badge-sm{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#475569;padding:4px 12px;border-radius:999px;font-size:11px}
    .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:8px auto 0}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <h1>Workforce Intelligence</h1>
      <p>AI-Powered HR & Payroll Platform v6.0</p>
    </div>

    <div class="auth-card">
      <div class="demo-box">
        <b>🔑 Demo — After Seeding DB</b>
        <b style="color:#fbbf24">👑 Admin:</b> admin@wip.com / Admin@123<br><b style="color:#86efac">👤 Employee:</b> piyush.sharma@wip.com / Piyush@123
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In →</button>
      <div class="spinner" id="spinner"></div>
      <div id="msg" class="msg-box"></div>
    </div>

    <div class="auth-link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
    <div class="badges">
      <span class="badge-sm">🔒 JWT Auth</span>
      <span class="badge-sm">🛡️ Role-based Access</span>
      <span class="badge-sm">⚡ v6.0</span>
    </div>
  </div>

  <script>
    var API = 'http://localhost:5000/api';

    function showMsg(txt, isErr) {
      var el = document.getElementById('msg');
      el.textContent = txt;
      el.className   = 'msg-box ' + (isErr ? 'error' : 'success');
    }

    function setLoading(on) {
      document.getElementById('loginBtn').disabled     = on;
      document.getElementById('loginBtn').style.display= on ? 'none' : '';
      document.getElementById('spinner').style.display = on ? 'block' : 'none';
    }

    async function doLogin() {
      var email    = document.getElementById('email').value.trim().toLowerCase();
      var password = document.getElementById('password').value;

      if (!email || !password) { showMsg('Please enter your email and password.', true); return; }

      setLoading(true);
      try {
        var res = await fetch(API + '/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });

        var d;
        try {
          d = await res.json();
        } catch (parseErr) {
          showMsg('Server returned an unexpected response. Is the backend running?', true);
          setLoading(false);
          return;
        }

        if (!res.ok) {
          showMsg(d.message || 'Login failed. Please check your credentials.', true);
          setLoading(false);
          return;
        }

        localStorage.setItem('token', d.token);
        localStorage.setItem('user',  JSON.stringify(d.user));
        showMsg('Login successful! Redirecting…', false);

        // role_id 1=Admin, 3=Manager, 4=HR → admin dashboard
        // role_id 2=Employee → employee dashboard
        setTimeout(function() {
          var role = d.user.role_id;
          if (role === 1 || role === 4) {
            window.location.href = 'admin-dashboard.html';
          } else if (role === 3) {
            window.location.href = 'manager.html';
          } else {
            window.location.href = 'employee-dashboard.html';
          }
        }, 700);

      } catch (e) {
        showMsg('⚠️ Cannot reach the server. Make sure the backend is running on http://localhost:5000', true);
        setLoading(false);
      }
    }

    document.querySelectorAll('input').forEach(function(inp) {
      inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    });

    // Auto-focus email
    document.getElementById('email').focus();
  </script>
  <footer style="text-align:center;color:#1e293b;font-size:11px;padding:20px">&copy; 2025 Workforce Intelligence Platform v6.0</footer>
</body>
</html>
