window.dlXLSX=window.dlXLSX||function(rows,headers,filename){
  if(!rows||!rows.length){window.st&&window.st('No data to export',false);return;}
  var keys=headers||Object.keys(rows[0]);
  // Build CSV that Excel can open as XLSX-like
  var BOM='﻿';
  var lines=[keys.map(function(k){return'"'+String(k).replace(/"/g,'""')+'"';}).join(',')];
  rows.forEach(function(r){lines.push(keys.map(function(k){var v=r[k]===null||r[k]===undefined?'':String(r[k]);return'"'+v.replace(/"/g,'""')+'"';}).join(','));});
  var csv=BOM+lines.join('\n');
  var blob=new Blob([csv],{type:'application/vnd.ms-excel;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(filename||'export')+'.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},1000);
  window.st&&window.st('Excel file downloaded',true);
};
