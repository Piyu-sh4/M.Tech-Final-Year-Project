services:
  db:
    image: mysql:8.0
    command: --skip-log-bin --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: test-root
      MYSQL_DATABASE: workforce_intelligence_test
      MYSQL_USER: wfi_test
      MYSQL_PASSWORD: test-db
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/snapshot.sql.gz:/docker-entrypoint-initdb.d/02_snapshot.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=test-db mysql --protocol=TCP -h 127.0.0.1 -u wfi_test workforce_intelligence_test -Nse 'SELECT 1 FROM wfi_bootstrap WHERE id=1' | grep -qx 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
  tests:
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_USER: wfi_test
      DB_PASSWORD: test-db
      DB_NAME: workforce_intelligence_test
      TEST_DB_NAME: workforce_intelligence_test
      JWT_SECRET: workforce-integration-test-key
